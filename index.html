<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LWS browser</title>
  <!-- solidos-nobuild supplies the import map (lit, rdflib, solid-logic, solid-ui, the panes)
       and the theme. Locally that's the symlink ./solidos-nobuild; ?solidos=<base> overrides,
       e.g. https://jss.live/solidos-nobuild/ (GitHub Pages sends CORS headers). -->
  <script>
    (function () {
      var base = new URL(location.href).searchParams.get('solidos') || './solidos-nobuild/'
      var script = document.createElement('script')
      script.src = new URL('src/importmap.js', new URL(base, location.href)).href
      document.write(script.outerHTML) // synchronous, so the import map lands before any module
      var link = document.createElement('link')
      link.rel = 'stylesheet'
      link.href = new URL('src/styles/theme.css', new URL(base, location.href)).href
      document.head.appendChild(link)
    })()
  </script>
  <style>
    body { margin: 0; background: #fff; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  </style>
  <script type="module" src="src/shell/app.js"></script>
</head>
<body>
  <lws-shell></lws-shell>
</body>
</html>
